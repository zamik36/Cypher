[default.extend-words]
# Double Ratchet header field: length of the previous sending chain (Signal spec).
pn = "pn"
# Retransmission timeout.
rto = "rto"
# The HTTP load generator (github.com/wg/wrk).
wrk = "wrk"

[default]
# Commit hashes in reports; base64 keys in test vectors.
extend-ignore-re = ["`[0-9a-f]{7,40}`", "\"[A-Za-z0-9_-]{40,}\""]

[files]
extend-exclude = ["*.lock", "apps/pwa/src/wasm/", "**/fuzz/corpus/"]
