# Reviewers come from .github/CODEOWNERS. Minor and patch updates of one
# ecosystem arrive as a single pull request; major ones one by one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, rust]
    groups:
      rust:
        update-types: [minor, patch]

  # npm workspaces share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, npm]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /apps/pwa]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  # Images pinned in docker-compose*.yml (Redis, NATS, Caddy, monitoring).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    groups:
      compose:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        update-types: [minor, patch]
