name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  RUST_TOOLCHAIN: "1.98.1"
  NIGHTLY: nightly-2026-09-20

jobs:
  # The tag must name the version everything carries (xtask versions), and
  # the changelog's section for it becomes the release notes.
  versions:
    name: Version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Versions agree with the tag
        run: cargo run -p xtask -- versions --tag "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # A release names images CI already built and tested for the tagged commit
  # (the tag must point at a commit pushed to main or dev); nothing is rebuilt.
  docker-release:
    name: Docker release tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [versions]
    steps:
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3
      - name: Tag the commit's images with the version
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF#refs/tags/}"
          for name in gateway signaling relay pwa; do
            base="ghcr.io/${repo}/cypher-${name}"
            docker buildx imagetools create --tag "${base}:${version}" "${base}:${GITHUB_SHA::8}"
          done

  desktop-release:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [versions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          key: desktop-${{ matrix.target }}-${{ hashFiles('crates/**/*.rs', 'apps/desktop/src-tauri/src/**/*.rs') }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libasound2-dev
      - name: Install desktop dependencies
        run: cd apps/desktop && npm install
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Cypher ${{ github.ref_name }}"
          releaseBody: ${{ needs.versions.outputs.notes }}
          releaseDraft: false
          prerelease: false

  # The Android project is in the repository (src-tauri/gen/android) and is
  # built as it is; the version comes from the workspace like everywhere else.
  # The release is signed with the keystore from the secrets: an AAB for
  # Google Play and an APK to install directly.
  android-release:
    name: Android (AAB and APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [versions]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          key: android-${{ hashFiles('crates/**/*.rs', 'apps/desktop/src-tauri/src/**/*.rs') }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          # tauri needs NDK_HOME; opusic-sys builds libopus with the NDK cmake toolchain.
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: cd apps/desktop && npm install
      - name: Signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release must be signed"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CYPHER_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build AAB and APK
        env:
          CYPHER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CYPHER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CYPHER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd apps/desktop && npx tauri android build --aab --apk --target aarch64 --target armv7
      - name: Name the artifacts by version
        run: |
          version="${GITHUB_REF_NAME#v}"
          out=apps/desktop/src-tauri/gen/android/app/build/outputs
          mkdir -p release
          cp "$(find "$out/bundle" -name '*.aab' | head -n1)" "release/cypher-${version}.aab"
          cp "$(find "$out/apk" -name '*.apk' | head -n1)" "release/cypher-${version}.apk"
          ls -la release
      - name: Upload to the release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
