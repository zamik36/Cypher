name: Setup VPS

# First install: clones the repository on the server and checks its tools.
# Starting the stack is the deploy's job (deploy.yml, run by hand with a sha
# or by the next push to main), so both use one code path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Prepare the server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DEPLOY_PATH,REPO_URL
          script: |
            set -eu
            # `up --wait` needs Compose v2.17 or newer.
            docker compose version
            dir="${DEPLOY_PATH:-$HOME/cypher}"
            if [ -d "$dir/.git" ]; then
              echo "$dir is already a clone"
            else
              git clone --quiet "$REPO_URL" "$dir"
              echo "Cloned into $dir; now run the Deploy workflow"
            fi
