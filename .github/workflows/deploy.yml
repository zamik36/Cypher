name: Deploy

# Production runs images pinned to the commit they were built from
# (IMAGE_TAG = first 8 hex digits of its sha). A deploy that does not become
# healthy returns to the last one that did, images included.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Redeploy a commit CI has built, e.g. to roll back by hand.
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha whose images to deploy
        required: true

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of interrupting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Only a push to this repository's main that passed CI: never a pull
    # request, and never a fork's branch that happens to be called main.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Check the commit
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha: $DEPLOY_SHA" >&2; exit 1; }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GATEWAY_NATS_PASSWORD: ${{ secrets.GATEWAY_NATS_PASSWORD }}
          SIGNALING_NATS_PASSWORD: ${{ secrets.SIGNALING_NATS_PASSWORD }}
          RELAY_NATS_PASSWORD: ${{ secrets.RELAY_NATS_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DOMAIN,REDIS_PASSWORD,GATEWAY_NATS_PASSWORD,SIGNALING_NATS_PASSWORD,RELAY_NATS_PASSWORD,GRAFANA_PASSWORD,DEPLOY_PATH,DEPLOY_SHA,GHCR_TOKEN,GHCR_USER
          command_timeout: 10m
          script: |
            set -eu
            cd "${DEPLOY_PATH:-$HOME/cypher}"
            compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"; }

            echo "Last healthy deploy: $(cat .deployed-sha 2>/dev/null || echo none)"
            git fetch --quiet origin "$DEPLOY_SHA"
            git checkout --quiet --detach "$DEPLOY_SHA"
            echo "Deploying $DEPLOY_SHA"

            # Secrets come from the envs parameter and stay in this file only.
            # A missing one would start services without credentials, so refuse.
            umask 077
            export GHCR_REPO="ghcr.io/zamik36/cypher"
            export IMAGE_TAG="$(printf %.8s "$DEPLOY_SHA")"
            : > .env.next
            for var in DOMAIN REDIS_PASSWORD GATEWAY_NATS_PASSWORD SIGNALING_NATS_PASSWORD RELAY_NATS_PASSWORD GHCR_REPO GRAFANA_PASSWORD IMAGE_TAG; do
              value="$(printenv "$var" || true)"
              [ -n "$value" ] || { echo "secret $var is not set" >&2; exit 1; }
              printf '%s=%s\n' "$var" "$value" >> .env.next
            done
            mv .env.next .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            compose pull --quiet
            docker logout ghcr.io
            # Recreates only what changed; --wait fails unless every service
            # with a healthcheck reports healthy in time.
            compose up -d --remove-orphans --wait --wait-timeout 180

            printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
            docker image prune -f > /dev/null
            echo "Deployed $DEPLOY_SHA"

      - name: Roll back to the last healthy deploy
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_USER
          command_timeout: 10m
          script: |
            set -eu
            cd "${DEPLOY_PATH:-$HOME/cypher}"
            compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"; }

            [ -f .deployed-sha ] || { echo "no healthy deploy recorded; nothing to return to" >&2; exit 1; }
            good="$(cat .deployed-sha)"
            echo "Returning to $good"
            git checkout --quiet --detach "$good"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$(printf %.8s "$good")/" .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            compose pull --quiet
            docker logout ghcr.io
            compose up -d --remove-orphans --wait --wait-timeout 180
            echo "Rolled back to $good"
