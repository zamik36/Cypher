[package]
name = "cypher-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cypher-client = { workspace = true, features = ["tor"] }
cypher-core.workspace = true
cypher-crypto.workspace = true
cypher-media = { workspace = true, features = ["capture"] }
cypher-tls.workspace = true
cypher-transport.workspace = true
cypher-types.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-cypher-files = { path = "plugins/cypher-files" }
mime_guess = "2"
percent-encoding = "2"
rustls.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
qrcode = "0.14"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
cypher-media = { workspace = true, features = ["test-util"] }
e2e = { path = "../../../tests/e2e" }
serde_json.workspace = true
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints]
workspace = true
