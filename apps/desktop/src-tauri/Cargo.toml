[package]
name = "cypher-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cypher-client = { workspace = true, features = ["tor"] }
cypher-core.workspace = true
cypher-crypto.workspace = true
cypher-media = { workspace = true, features = ["capture"] }
cypher-tls.workspace = true
cypher-transport.workspace = true
cypher-types.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
qrcode = "0.14"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints]
workspace = true
