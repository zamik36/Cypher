[workspace]
resolver = "2"
members = [
    "crates/cypher-types",
    "crates/cypher-wire",
    "crates/cypher-crypto",
    "crates/cypher-core",
    "crates/cypher-media",
    "crates/cypher-client",
    "crates/cypher-wasm",
    "crates/cypher-tls",
    "crates/cypher-transport",
    "crates/cypher-server-kit",
    "services/gateway",
    "services/signaling",
    "services/relay",
    "tools/load-test",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/cypher-types",
    "crates/cypher-wire",
    "crates/cypher-crypto",
    "crates/cypher-core",
    "crates/cypher-media",
    "crates/cypher-client",
    "crates/cypher-wasm",
    "crates/cypher-tls",
    "crates/cypher-transport",
    "crates/cypher-server-kit",
    "services/gateway",
    "services/signaling",
    "services/relay",
    "tools/load-test",
]
exclude = [
    "crates/cypher-crypto/fuzz",
    "crates/cypher-wire/fuzz",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
needless_pass_by_ref_mut = "warn"
large_futures = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
bytes = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
rand_chacha = "0.3"
proptest = "1"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
bip39 = { version = "2", features = ["std"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
async-nats = { version = "0.47", default-features = false, features = ["server_2_10", "ring"] }
futures = "0.3"
prometheus = "0.13"
clap = { version = "4", features = ["derive"] }
rcgen = { version = "0.14", features = ["pem"] }
webpki-roots = "1.0"
rustls-pki-types = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = "0.28"
tor-rtcompat = { version = "0.46", default-features = false, features = ["tokio", "rustls"] }
arti-client = { version = "0.46", default-features = false, features = ["tokio", "rustls", "compression", "bridge-client", "pt-client", "static-sqlite"] }

# Internal crates
cypher-types = { path = "crates/cypher-types" }
cypher-wire = { path = "crates/cypher-wire" }
cypher-core = { path = "crates/cypher-core" }
cypher-media = { path = "crates/cypher-media" }
cypher-client = { path = "crates/cypher-client" }
cypher-server-kit = { path = "crates/cypher-server-kit" }
cypher-crypto = { path = "crates/cypher-crypto" }
cypher-tls = { path = "crates/cypher-tls" }
cypher-transport = { path = "crates/cypher-transport" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

# The Opus encoder is CPU-bound C translated to Rust; unoptimized it cannot
# keep up with real-time capture in debug builds.
[profile.dev.package.unsafe-libopus]
opt-level = 3
