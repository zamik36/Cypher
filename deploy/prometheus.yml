global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: "signaling"
    static_configs:
      - targets: ["signaling:9091"]

  - job_name: "relay"
    static_configs:
      - targets: ["relay:9092"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # TLS handshakes with the client-facing listeners: whether they answer,
  # and when the certificate they serve expires (it is Caddy's, copied).
  - job_name: "tls"
    metrics_path: /probe
    params:
      module: [tls]
    static_configs:
      - targets: ["gateway:9100", "relay:9300"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
