# Least-privilege NATS users. Passwords come from the environment.
#   gateway   relays peer frames, evicts old sessions, asks signaling
#   signaling answers sig.req / sig.onion requests only
#   relay     forwards sealed onion requests only
# Only the gateway may send sig.req, so the cy-peer identity header cannot
# be forged by a compromised relay.

port: 4222
http_port: 8222
max_payload: 2MB

authorization {
  users = [
    {
      user: gateway
      password: $GATEWAY_NATS_PASSWORD
      permissions: {
        publish: ["peer.*", "ctl.*", "sig.req", "_INBOX.>"]
        subscribe: ["peer.*", "ctl.*", "_INBOX.>"]
      }
    }
    {
      user: signaling
      password: $SIGNALING_NATS_PASSWORD
      permissions: {
        publish: { deny: ">" }
        subscribe: ["sig.req", "sig.onion"]
        allow_responses: true
      }
    }
    {
      user: relay
      password: $RELAY_NATS_PASSWORD
      permissions: {
        publish: ["sig.onion"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
