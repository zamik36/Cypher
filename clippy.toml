too-many-lines-threshold = 60
cognitive-complexity-threshold = 20
excessive-nesting-threshold = 5
too-many-arguments-threshold = 6
type-complexity-threshold = 250
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
disallowed-methods = [
  { path = "std::thread::sleep", reason = "blocks the async runtime; use tokio::time::sleep" },
  { path = "std::env::set_var", reason = "unsound with concurrent threads" },
  { path = "std::env::remove_var", reason = "unsound with concurrent threads" },
  { path = "std::process::exit", reason = "return an ExitCode from main instead" },
  { path = "rand::thread_rng", reason = "use OsRng or an injected CryptoRngCore", allow-invalid = true },
  { path = "rand::random", reason = "use OsRng or an injected CryptoRngCore", allow-invalid = true },
]
